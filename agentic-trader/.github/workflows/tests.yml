name: tests

# The risk scripts are the only thing standing between a thesis and an
# order, so they get checked on every change, on every Python the repo
# claims to support.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest

      - name: Verify risk_rules.json is valid JSON
        run: python -c "import json; json.load(open('risk_rules.json'))"

      - name: Verify the scripts run with no third-party packages installed
        # They are documented as stdlib-only. A stray import would only
        # surface in production, mid-cycle, as a halt.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = set(getattr(sys, "stdlib_module_names", ()))
          local = {p.stem for p in pathlib.Path("scripts").glob("*.py")}
          bad = []
          for path in sorted(pathlib.Path("scripts").glob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if stdlib and name not in stdlib and name not in local:
                          bad.append(f"{path}: {name}")
          if bad:
              print("non-stdlib imports found in scripts/:")
              print("\n".join(bad))
              sys.exit(1)
          print("scripts/ is stdlib-only")
          PY
